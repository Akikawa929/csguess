name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No dependencies to install: scripts/build-web.mjs uses Node's built-in
      # TypeScript transform and emits plain ES modules.
      - run: node scripts/build-players.mjs
      - run: node scripts/validate.mjs
      - run: node test/game.test.ts
      - run: node scripts/build-web.mjs
      - run: node test/ui.test.mjs
      - run: node test/standalone.test.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
